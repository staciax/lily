# Based on the Hummingbird project's benchmark workflow
# https://github.com/hummingbird-project/hummingbird

name: Benchmark PR vs main

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '**.swift'
      - 'Makefile'
      - '.github/workflows/benchmark.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-benchmark
  cancel-in-progress: true

permissions: {}

env:
  ENABLE_LILY_BENCHMARKS: true

jobs:
  benchmark-delta:
    name: Benchmark Delta (PR vs main)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write

    strategy:
      matrix:
        os: [ubuntu-latest]
        image: ["swift:latest"]

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install libjemalloc-dev
        run: |
          apt-get -q update
          apt-get install -y libjemalloc-dev

      # https://github.com/actions/checkout/issues/766
      - name: Mark the workspace as safe
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: Miscellaneous
        run: |
          [ -d Benchmarks ] && echo "hasBenchmark=1" >> $GITHUB_ENV
          echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH

      - name: Run benchmarks for PR branch
        if: ${{ env.hasBenchmark == '1' }}
        run: |
          swift package --allow-writing-to-directory .benchmark-baselines/ benchmark baseline update pull_request

      - name: Checkout main
        run: |
          git checkout main

      - name: Run benchmarks for branch 'main'
        if: ${{ env.hasBenchmark == '1' }}
        run: |
          swift package --allow-writing-to-directory .benchmark-baselines/ benchmark baseline update main

      - name: Compare PR and main
        if: ${{ env.hasBenchmark == '1' }}
        id: benchmark
        run: |
          set +e
          # if we had access to fd 3 we could do this in one call eg { var=$(cmd 3>&2 2>&1 1>&3); }  2>&1
          # but unfortunately we don't so we have to run the baseline check twice once to extract stdout
          # and once to extract stderr
          BENCHMARK_STDERR=$(swift package benchmark baseline check main pull_request 2>&1)
          echo "exit-status=$?" >> $GITHUB_OUTPUT
          echo "benchmark-stderr<<EOF" >> $GITHUB_OUTPUT
          echo "$BENCHMARK_STDERR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          set -e

      - name: Pull request comment text
        if: ${{ env.hasBenchmark == '1' }}
        id: benchmark-comment
        run: |
          echo 'PRTEST<<EOF' >> $GITHUB_ENV

          EXIT_CODE='${{steps.benchmark.outputs.exit-status}}'
          BENCHMARK_STDERR='${{steps.benchmark.outputs.benchmark-stderr}}'
          EXIT_STATUS=0

          case "${EXIT_CODE}" in
            0)
              echo "_✅ Pull request no significant performance differences ✅_" >> $GITHUB_ENV
              ;;
            *)
              if echo "$BENCHMARK_STDERR" | grep -q -i "WORSE\|Threshold deviations\|benchmarkThresholdRegression"; then
                echo "_❌ Pull request has performance regressions ❌_" >> $GITHUB_ENV
              else
                echo "_❌ Benchmark comparison failed ❌_" >> $GITHUB_ENV
              fi
              EXIT_STATUS=1
              ;;
          esac

          set +e
          echo "<details><summary>Summary</summary>" >> $GITHUB_ENV
          swift package benchmark baseline check main pull_request --format markdown >> $GITHUB_ENV
          echo "</details><details><summary>Full Benchmark Comparison</summary>" >> $GITHUB_ENV
          swift package benchmark baseline compare main pull_request --no-progress --quiet --format markdown >> $GITHUB_ENV
          echo "</details>" >> $GITHUB_ENV
          set -e

          echo 'EOF' >> $GITHUB_ENV
          echo "exitStatus=$EXIT_STATUS" >> $GITHUB_ENV

      - name: Comment PR
        if: ${{ env.hasBenchmark == '1' }}
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: ${{ env.PRTEST }}
          comment-tag: benchmark

      - name: Exit with correct status
        if: ${{ env.hasBenchmark == '1' }}
        run: |
          exit ${{env.exitStatus}}
